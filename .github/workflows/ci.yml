name: CI

on:
  push:
    branches: [init]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Compile Python sources
        run: >-
          python -m compileall -q src pilot_collect.py translation_eval.py
          translation_holdout.py translation_final_test.py
