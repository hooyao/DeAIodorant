<div class="ProseMirror"><p data-type="paragraph">本问答帖原创发布在<a data-type="link" href="https://developer.huawei.com/consumer/cn/forum/?ha_source=InfoQ&amp;ha_sourceId=70000011" title="xxx">华为开发者联盟社区</a> ，欢迎开发者前往论坛提问交流。</p><h2 data-id="heading0" data-type="heading">问题描述：</h2><p data-type="paragraph">开发元服务时，需要设置屏幕亮度，发现 @system.brightness 和 @ohos.settings 在元服务当中都不支持，有替代 api 可以实现吗？</p><h2 data-id="heading1" data-type="heading">解决方案：</h2><p data-type="paragraph">推荐使用 setWindowBrightness 这个接口来设置屏幕亮度，</p><p data-type="paragraph">参考 demo、详细解决方案以及相关的讨论，请点击原帖查看：</p><p data-type="paragraph"><a data-type="link" href="https://developer.huawei.com/consumer/cn/forum/topic/0207166812051982882?fid=0109140870620153026" title=""><u>元服务如何获取/设置屏幕亮度-华为开发者问答 | 华为开发者联盟 (huawei.com)</u></a></p></div>
